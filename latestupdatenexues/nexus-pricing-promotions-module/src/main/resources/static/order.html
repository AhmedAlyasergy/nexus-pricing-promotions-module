<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Nexus Logistics | Order Management</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .order-box {
        background: var(--card);
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        background: var(--bg-dark);
        border: 1px solid var(--text-gray);
        color: white;
        border-radius: 6px;
      }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        background: var(--accent-teal);
        color: #000;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
      .result-card {
        margin-top: 25px;
        background: var(--card);
        padding: 25px;
        border-radius: 10px;
      }
      .result-card h2 {
        color: var(--accent-teal);
        margin: 0;
      }
      .order-item {
        margin: 10px 0;
        padding: 10px;
        background: var(--bg-dark);
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <img src="NexuesLogo.png" class="app-logo" />

      <div class="warehouse-info">
        <span>ORDER SYSTEM</span>
        <p>Order Management</p>
      </div>

      <nav>
        <a href="index.html">📦 Inventory</a>
        <a href="pricing.html">💰 Pricing</a>
        <a href="order.html" class="active">🛒 Orders</a>
        <a href="checkout.html">💳 Checkout</a>
        <a href="index.html">🏷️ Suppliers</a>
        <a href="index.html">📊 Analytics</a>
        <a href="login.html" style="margin-top: 50px; color: #ff4d4d"
          >🚪 Sign Out</a
        >
      </nav>
    </div>

    <div class="main">
      <header>
        <h1>Order Management</h1>
        <div id="status-indicator">ORDER SYSTEM</div>
      </header>

      <div class="order-box">
        <h2>Create New Order</h2>
        <div class="form-row">
          <div>
            <label>Order Type</label>
            <select id="orderType">
              <option value="NORMAL">Normal</option>
              <option value="BULK">Bulk</option>
              <option value="SUBSCRIPTION">Subscription</option>
            </select>
          </div>
          <div id="subscriptionMonthsDiv" style="display: none">
            <label>Subscription Months</label>
            <input type="number" id="subscriptionMonths" min="1" value="1" />
          </div>
        </div>

        <div id="orderItems">
          <h3>Order Items</h3>
        </div>
        <button onclick="addItem()">Add Item</button>
        <button onclick="createOrder()">Create Order</button>
      </div>

      <div class="order-box">
        <h2>View Orders</h2>
        <button onclick="viewAllOrders()">View All Active Orders</button>
        <button onclick="viewOrderHistory()">View Order History</button>
        <div id="ordersList"></div>
      </div>

      <div class="order-box">
        <h2>Manage Order</h2>
        <label>Order ID</label>
        <input type="number" id="manageOrderId" />
        <button onclick="viewOrder()">View Order</button>
        <button onclick="cancelOrder()">Cancel Order</button>
      </div>

      <script>
        let orderItems = [];

        document
          .getElementById("orderType")
          .addEventListener("change", function () {
            const subDiv = document.getElementById("subscriptionMonthsDiv");
            subDiv.style.display =
              this.value === "SUBSCRIPTION" ? "block" : "none";
          });

        function addItem() {
          const container = document.getElementById("orderItems");
          const itemDiv = document.createElement("div");
          itemDiv.className = "order-item";
          itemDiv.innerHTML = `
            <label>Product ID</label>
            <input type="text" class="productId" placeholder="e.g., P001" />
            <label>Quantity</label>
            <input type="number" class="quantity" min="1" value="1" />
            <button onclick="removeItem(this)">Remove</button>
          `;
          container.appendChild(itemDiv);
        }

        function removeItem(button) {
          button.parentElement.remove();
        }

        async function createOrder() {
          const type = document.getElementById("orderType").value;
          const months = document.getElementById("subscriptionMonths").value;

          const itemDivs = document.querySelectorAll("#orderItems .order-item");
          const items = [];
          itemDivs.forEach((div) => {
            const productId = div.querySelector(".productId").value;
            const quantity = div.querySelector(".quantity").value;
            if (productId && quantity) {
              items.push({
                product: {
                  id: productId,
                  name: "Product " + productId,
                  price: 100, // placeholder
                },
                quantity: parseInt(quantity),
              });
            }
          });

          if (items.length === 0) {
            alert("Add at least one item");
            return;
          }

          let url = `/api/orders/create?type=${type}`;
          let body = JSON.stringify(items);

          if (type === "SUBSCRIPTION") {
            url = `/api/orders/create/subscription?type=${type}&months=${months}`;
          }

          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: body,
            });
            const order = await response.json();
            alert("Order created: " + JSON.stringify(order));
            // Clear items
            document.getElementById("orderItems").innerHTML =
              "<h3>Order Items</h3>";
          } catch (error) {
            alert("Error creating order: " + error);
          }
        }

        async function viewAllOrders() {
          try {
            const response = await fetch("/api/orders/all");
            const orders = await response.json();
            displayOrders(orders);
          } catch (error) {
            alert("Error fetching orders: " + error);
          }
        }

        async function viewOrderHistory() {
          try {
            const response = await fetch("/api/orders/history");
            const orders = await response.json();
            displayOrders(orders);
          } catch (error) {
            alert("Error fetching order history: " + error);
          }
        }

        async function viewOrder() {
          const id = document.getElementById("manageOrderId").value;
          try {
            const response = await fetch(`/api/orders/${id}`);
            const order = await response.json();
            displayOrders([order]);
          } catch (error) {
            alert("Error fetching order: " + error);
          }
        }

        async function cancelOrder() {
          const id = document.getElementById("manageOrderId").value;
          try {
            await fetch(`/api/orders/${id}/cancel`, { method: "POST" });
            alert("Order cancelled");
          } catch (error) {
            alert("Error cancelling order: " + error);
          }
        }

        function displayOrders(orders) {
          const container = document.getElementById("ordersList");
          container.innerHTML = "<h3>Orders</h3>";
          orders.forEach((order) => {
            container.innerHTML += `
            <div class="result-card">
                <h2>Order ${order.orderId}</h2>
                <p>Status: ${order.status}</p>
                <p>Total: $${order.totalAmount ? order.totalAmount.toFixed(2) : "N/A"}</p>
                <p>Items: ${order.items ? order.items.length : 0}</p>
            </div>
        `;
          });
        }
      </script>
    </div>
  </body>
</html>
