<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Nexus Logistics | Checkout</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .checkout-box {
        background: var(--card);
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        background: var(--bg-dark);
        border: 1px solid var(--text-gray);
        color: white;
        border-radius: 6px;
      }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        background: var(--accent-teal);
        color: #000;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
      .result-card {
        margin-top: 25px;
        background: var(--card);
        padding: 25px;
        border-radius: 10px;
      }
      .result-card h2 {
        color: var(--accent-teal);
        margin: 0;
      }
      .checkout-summary {
        background: var(--bg-dark);
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <img src="NexuesLogo.png" class="app-logo" />

      <div class="warehouse-info">
        <span>CHECKOUT SYSTEM</span>
        <p>Order Checkout</p>
      </div>

      <nav>
        <a href="index.html">📦 Inventory</a>
        <a href="pricing.html">💰 Pricing</a>
        <a href="order.html">🛒 Orders</a>
        <a href="checkout.html" class="active">💳 Checkout</a>
        <a href="index.html">🏷️ Suppliers</a>
        <a href="index.html">📊 Analytics</a>
        <a href="login.html" style="margin-top: 50px; color: #ff4d4d"
          >🚪 Sign Out</a
        >
      </nav>
    </div>

    <div class="main">
      <header>
        <h1>Order Checkout</h1>
        <div id="status-indicator">CHECKOUT SYSTEM</div>
      </header>

      <div class="checkout-box">
        <h2>Checkout Order</h2>
        <label>Order ID</label>
        <input type="number" id="orderId" placeholder="Enter Order ID" />
        <button onclick="loadOrder()">Load Order</button>

        <div id="orderDetails" style="display: none">
          <div class="checkout-summary">
            <h3>Order Summary</h3>
            <p id="orderInfo"></p>
            <p id="totalAmount"></p>
          </div>
          <button onclick="checkoutOrder()">Complete Checkout</button>
        </div>
      </div>

      <div id="checkoutResult"></div>

      <script>
        async function loadOrder() {
          const id = document.getElementById("orderId").value;
          try {
            const response = await fetch(`/api/orders/${id}`);
            const order = await response.json();
            displayOrder(order);
          } catch (error) {
            alert("Error loading order: " + error);
          }
        }

        function displayOrder(order) {
          const details = document.getElementById("orderDetails");
          const info = document.getElementById("orderInfo");
          const total = document.getElementById("totalAmount");

          info.innerHTML = `
        Order ID: ${order.orderId}<br>
        Status: ${order.status}<br>
        Items: ${order.items ? order.items.length : 0}
    `;
          total.innerHTML = `Total Amount: $${order.totalAmount ? order.totalAmount.toFixed(2) : "N/A"}`;

          details.style.display = "block";
        }

        async function checkoutOrder() {
          const id = document.getElementById("orderId").value;
          try {
            const response = await fetch(`/api/orders/${id}/checkout`, {
              method: "POST",
            });
            const total = await response.json();
            document.getElementById("checkoutResult").innerHTML = `
            <div class="result-card">
                <h2>Checkout Successful</h2>
                <p>Total Paid: $${total.toFixed(2)}</p>
            </div>
        `;
            document.getElementById("orderDetails").style.display = "none";
          } catch (error) {
            alert("Error during checkout: " + error);
          }
        }
      </script>
    </div>
  </body>
</html>
